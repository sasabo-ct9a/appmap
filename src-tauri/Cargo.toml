[package]
name = "tauri-app"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v0.1.7 ローカル LLM 機能:HTTP クライアント(モデル DL + llama-server 通信)+ stream 処理
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
# v0.1.10 ファイル監視:コード保存を検知して自動で再スキャンさせるため。
#   notify: OS ネイティブのファイルシステムイベント
#   notify-debouncer-mini: 保存時の連続イベントを 500ms でデバウンス
notify = "6"
notify-debouncer-mini = "0.4"
# v0.1.33 .gitignore 判定:手書き近似 glob だと末尾 `/`・`**`・否定 `!`・アンカリングで
#   エッジケースの取りこぼし/誤検出が繰り返し出た(Codex round 17-18)。ripgrep と同じ
#   `ignore` クレートに委譲して Git 完全互換にし、この種のバグを恒久的に無くす。
ignore = "0.4"

[dev-dependencies]
# fixture 化した実 FS を作って detect_project_meta などをテストする用途。
tempfile = "3"
